name: Publish Vyasa UI to GitHub Packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish-gpr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@project-vyasa'
      
      - name: Install dependencies
        run: bun install
        working-directory: svelte

      - name: Build Svelte package
        run: bun run build
        working-directory: svelte

      - name: Publish to GitHub Packages
        run: npm publish
        working-directory: svelte
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
